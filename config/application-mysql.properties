# Local development only. Run from the repository root with the mysql profile.
spring.config.import=file:./.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ledger_lab?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=ledger_lab
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
